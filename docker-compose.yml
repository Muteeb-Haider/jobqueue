version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobqueue
      LISTEN_ADDR: "0.0.0.0:50051"
      RUST_LOG: info
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
